
models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    columns:

      - name: listing_id
        description: Primary key for the listing
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room']

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values

  - name: dim_hosts_cleansed
    versions:
      - v : 1
        defined_in: dim_hosts_cleansed.sql
      
      - v : 2
        defined_in: dim_hosts_cleansed_v2.sql

    latest_version: 1
        

      
    description: Cleansed table which contains Airbnb hosts.
    columns:
      - name: host_id
        description: Primary key for the host
        data_tests:
          - not_null
          - unique

      - name: host_name
        description: The name of the host
        data_tests:
          - not_null

      - name: is_superhost
        description: Indicates if the host is a superhost
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

  - name: dim_listings_w_hosts
    description: A table which contains Airbnb listings and their corresponding hosts.
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')

  - name: fct_reviews
    description: Fact table which contains Airbnb reviews.
    columns:
      - name: listing_id
        description: The listing to which the review belongs.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: reviewer_name
        description: The name of the reviewer.
        data_tests:
          - not_null

      - name: review_sentiment
        description: The sentiment of the review.
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']

      
